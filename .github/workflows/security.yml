# Controles de DevSecOps que atuam no Gate 2 (pull request) e semanalmente sobre o código parado.
# SAST fica em codeql.yml; DAST e scan de imagem ficam em cd.yml.
name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Toda segunda-feira às 06:00 UTC: pega CVEs publicadas sem que o código tenha mudado.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  secrets:
    name: Secrets scanning (bloqueante)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Histórico completo: um segredo removido no último commit continua no histórico.
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sca:
    name: SCA · ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [server-api, inner-view-client]
    steps:
      - uses: actions/checkout@v7

      # Bloqueante: apenas CRITICAL/HIGH que já possuem correção publicada.
      - name: Trivy · dependências (bloqueante)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: ${{ matrix.app }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          trivy-config: ''

      # Informativo: relatório completo, todas as severidades, sempre publicado.
      - name: Trivy · relatório completo (informativo)
        if: always()
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: ${{ matrix.app }}
          scanners: vuln
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: '0'
          format: sarif
          output: trivy-${{ matrix.app }}.sarif

      - name: Enviar resultado para o Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.app }}.sarif
          category: sca-${{ matrix.app }}

  sbom:
    name: SBOM · ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [server-api, inner-view-client]
    steps:
      - uses: actions/checkout@v7

      # SBOM em CycloneDX, anexado a toda execução: inventário do que foi liberado.
      - name: Gerar SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: ${{ matrix.app }}
          format: cyclonedx-json
          artifact-name: sbom-${{ matrix.app }}.cdx.json
          output-file: sbom-${{ matrix.app }}.cdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.app }}
          path: sbom-${{ matrix.app }}.cdx.json
          retention-days: 90
